name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.WEIGHTTREND_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::Secret WEIGHTTREND_KEYSTORE is not set: building with a throwaway key. Such an APK cannot be installed over a properly signed one."
          else
            mkdir -p app/keystore
            echo "$KEYSTORE" | base64 -d > app/keystore/personal.jks
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: |
          ./gradlew --no-daemon assembleRelease
          ls -la app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/*.apk WeightTrend.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WeightTrend-apk
          path: WeightTrend.apk

      # A plain .apk download (no zip) at a fixed address:
      # https://github.com/<owner>/<repo>/releases/latest/download/WeightTrend.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" WeightTrend.apk \
            --title "Сборка ${{ github.run_number }}" \
            --notes "Коммит ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA" --latest
